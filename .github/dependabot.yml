# Security fixes arrive as one grouped PR instead of one PR per package.
# open-pull-requests-limit: 0 turns off routine version-bump PRs; security PRs still open.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
